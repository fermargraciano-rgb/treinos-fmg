.brand .ph{display:inline-flex;align-items:center;gap:10px;text-align:left}.brand .ph i{width:44px;height:44px;border-radius:50%;background:var(--orange);border:2px solid var(--dark);color:var(--dark);font:800 13px 'Inter',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;font-style:normal}
.brand .ph b{display:block;color:var(--dark);font-size:12px;letter-spacing:.3px;line-height:1.2}.brand .ph span{display:block;font-size:10px;letter-spacing:3px;color:var(--orange);font-weight:700}
.rule{border:0;border-top:1.5px solid var(--orange);margin:12px 16px 0}
.casalbar{position:sticky;z-index:4;background:var(--orange);color:var(--dark);margin:0 -16px 10px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 6px #0003}.casalbar b{display:block;font-size:20px;line-height:1.1}.casalbar small{display:block;font-size:12px}.casalbar button{background:var(--dark);color:#fff;border-color:var(--dark)}
.stk{position:sticky;z-index:4;background:var(--bg);padding:6px 0 8px;margin:-4px 0 6px}
body.locked #app,body.locked header,body.locked #brand,body.locked .bar{display:none!important}
#lock{position:fixed;inset:0;background:var(--cream);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}#lock .box{width:100%;max-width:380px;margin:auto}
header{position:sticky;top:0;background:var(--white);padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:5;border-bottom:1.5px solid var(--orange)}
header h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;font-weight:700;letter-spacing:.3px}
main{max-width:680px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:12px}
.cardh{background:var(--orange);color:var(--white);font-weight:700;margin:-14px -14px 10px;padding:8px 14px;border-radius:5px 5px 0 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cardh .mut{color:var(--white)}
button{font:inherit;font-weight:600;color:var(--dark);background:var(--white);border:1.5px solid var(--orange);border-radius:6px;padding:10px 14px;cursor:pointer}
button.p{background:var(--orange);color:var(--white);font-weight:700}
button.d{background:var(--white);color:var(--rd);border-color:var(--rd)}button.s{padding:6px 10px;font-size:14px}
button.big{padding:14px 0;font-size:22px;font-weight:700;flex:1}
input,textarea,select{font:inherit;background:var(--white);color:var(--dark);border:1px solid var(--divider);border-radius:6px;padding:10px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--orange);outline-offset:0}
label{display:block;color:var(--mut);font-size:13px;margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}.row>.fit{flex:0 0 auto}
.mut{color:var(--mut);font-size:14px}.h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.set{padding:10px;background:var(--white);border:1px solid var(--border);border-radius:6px;margin-top:6px}
.set.ok{background:var(--white);border-color:var(--vdbd);box-shadow:inset 4px 0 0 var(--vd)}
.set.or{border:2px solid var(--or);background:var(--orbg);box-shadow:none}
.atencao{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--orbg);border:1px solid var(--or);border-left:5px solid var(--or);border-radius:6px;padding:10px 12px;margin-bottom:12px;white-space:pre-wrap}.atencao b{color:var(--or);font-size:12px;letter-spacing:.06em}.atencao>div{flex:1}.atencao button{flex:0 0 auto;background:var(--white);border-color:var(--or)}
.alerta{color:var(--or);font-size:12px;font-weight:700}
.chk{width:44px;height:44px;border-radius:50%;padding:0;font-size:22px;flex:0 0 44px;color:var(--orange);border-color:var(--divider)}
.chk.p{background:var(--vd);border-color:var(--vd);color:var(--white)}
.carga{font-size:28px;font-weight:700;text-align:center;padding:8px 4px}.cg{flex:2;display:flex;align-items:center;gap:6px}.cg span{color:var(--mut)}input.sc{width:84px;text-align:center;font-weight:700;padding:8px 4px}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1.5px solid var(--orange);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:6}
.fixa{background:var(--cream);border:1px solid var(--border);border-left:4px solid var(--orange);border-radius:6px;padding:10px 12px;margin-bottom:12px;white-space:pre-wrap;cursor:pointer;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs button{flex:1;white-space:nowrap;padding:10px 6px;font-size:14px}.tabs .on,.chips .on{background:var(--orange);color:var(--white);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{background:var(--orange);color:var(--white);border-radius:4px;padding:2px 8px;font-size:12px;font-weight:700}
.sug{background:var(--cream);border:1px solid var(--orange);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:14px}
.foot{border-top:.5px solid var(--divider);margin-top:24px;padding-top:10px;text-align:center;font-size:12px;color:var(--mut)}.foot b{color:var(--orange)}
a{color:var(--dark);font-weight:700}
.ex-todo{background:var(--azbg);border-color:var(--azbd)}.ex-todo .cardh{background:var(--az)}.ex-todo .set{border-color:var(--azbd)}
.ex-orig{background:#ececec;border:1px dashed #aaa;opacity:.6;filter:grayscale(1);margin-bottom:6px}.ex-orig .cardh{background:#999}.ex-orig .cardh b{text-decoration:line-through}
.ex-done{background:var(--vdbg);border-color:var(--vdbd)}.ex-done .cardh{background:var(--vd)}
.pend{display:flex;gap:10px;align-items:center;background:var(--white);border:1px solid var(--border);border-left:6px solid var(--pc);border-radius:6px;padding:10px 12px;margin-bottom:8px}
.pend .pb{flex:1;min-width:0}.pend b{display:block;font-size:15px;line-height:1.25}.pend .mut{font-size:12.5px;margin-top:2px}.pend button{flex:0 0 auto;background:var(--white)}
.venc{color:var(--pr);font-weight:800}.breve{color:#B26A00;font-weight:800}
.pal{background:var(--pr);color:var(--white);font-weight:700;border-radius:6px;padding:8px 12px;margin-bottom:8px;font-size:14px}
details summary{cursor:pointer;padding:4px 0}
h1,h2,h3{letter-spacing:-.01em}
.hero{background:var(--dark);color:var(--white);border-radius:10px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--orange);opacity:.95}
.hero small{display:block;color:#BDBDBD;font-size:13px;position:relative;z-index:1}.hero small:first-letter{text-transform:uppercase}
.hero h2{margin:2px 0 6px;font-size:26px;font-weight:800;position:relative;z-index:1}
.live{background:var(--orange);color:var(--white);border-radius:10px;padding:14px 16px;margin-bottom:14px;cursor:pointer;display:flex;align-items:center;gap:12px}
.live b{display:block;font-size:16px}.live span{font-size:13px;opacity:.95}.live .go{margin-left:auto;background:var(--white);color:var(--dark);border-radius:6px;padding:8px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.sec{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
.recent{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px}
.av{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;width:68px;background:none;border:0;padding:4px 0;font-size:12px;font-weight:600}
.av i{width:50px;height:50px;border-radius:50%;background:var(--cream);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font:800 16px 'Inter',sans-serif;font-style:normal;color:var(--dark)}
.av.on i{background:var(--orange);border-color:var(--orange);color:var(--white)}
.stu{background:var(--cream);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.stu .who{display:flex;align-items:center;gap:12px;margin-bottom:12px}.stu .who i{width:54px;height:54px;border-radius:50%;background:var(--orange);color:var(--white);display:flex;align-items:center;justify-content:center;font:800 19px 'Inter',sans-serif;font-style:normal;flex:0 0 54px}
.stu .who b{display:block;font-size:20px;font-weight:800;line-height:1.15}
.next{background:var(--white);border:1px solid var(--border);border-left:4px solid var(--orange);border-radius:6px;padding:10px 12px;margin-bottom:12px}
.next b{font-size:17px}.next .mut{font-size:13px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:10px;border:1.5px solid var(--orange);background:var(--white);min-height:84px}
.tile em{font-style:normal;font-size:26px;line-height:1;font-weight:800;color:var(--orange)}.tile.p em{color:var(--white)}.tile span{font-size:15px;font-weight:700}.tile.p{background:var(--orange);color:var(--white)}
.tile.p span{color:var(--white)}.tile.r{grid-column:span 2;min-height:64px;background:var(--rd);border-color:var(--rd)}.tile.r em,.tile.r span{color:var(--white)}
.link{background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline;width:100%;margin-top:6px;font-weight:500}svg text{fill:#6B6B6B;font-size:11px}

function garantirTreinosUn(a,unId,de){if(a.treinos.some(t=>t.unidadeId===unId&&t.programaId===a.prog))return;
  a.treinos.filter(t=>t.programaId===a.prog&&t.unidadeId!==unId).sort((x,y)=>(y.unidadeId===de)-(x.unidadeId===de)).forEach(t=>{if(a.treinos.some(x=>x.unidadeId===unId&&x.programaId===a.prog&&x.nome===t.nome))return;
    const c={...JSON.parse(JSON.stringify(t)),id:uid(),unidadeId:unId};
    c.exs.forEach(e=>{if(ehMaq(e)){e.maq=true;const h=histEx(a,e.nome,unId);e.carga=h&&h.mesmaUn?h.carga:0}});a.treinos.push(c)})}

  save()}

async function copiarTreino(a,t){const outras=a.unidades.filter(u=>u.id!==t.unidadeId);if(!outras.length){await yes('Este aluno só tem uma unidade. Crie outra com "+ unidade".','OK');return}

function evoHtml(a){

  return`<div class="card"><label>Exercício</label><select id="evx">${nomes.map(n=>`<option>${esc(n)}</option>`).join('')}</select><label>Métrica</label><select id="evm"></select></div><div class="card" id="evc"></div>`}
function evoSetup(a){if(!$('#evx'))return;
  const eT=n=>{for(const x of a.sessoes){const e=x.exs.find(y=>y.nome===n);if(e)return e.tempo!==undefined?!!e.tempo:ehTempo(n)}return ehTempo(n)};
  const opcoes=()=>{const t=eT($('#evx').value),m=$('#evm'),v=m.value;m.innerHTML=t?'<option value="t">Maior tempo (s)</option><option value="tt">Tempo total (s)</option>':'<option value="rm">1RM estimado (Epley)</option><option value="c">Maior carga</option>';if([...m.options].some(o=>o.value===v))m.value=v};
  const draw=()=>{const n=$('#evx').value,m=$('#evm').value;
    const pts=a.sessoes.filter(s=>s.exs.some(e=>e.nome===n)).reverse().map(s=>{const sets=s.exs.filter(e=>e.nome===n).flatMap(e=>e.sets.filter(x=>x.feito));if(!sets.length)return null;
      const y=m==='rm'?Math.max(...sets.map(x=>e1rm(x.carga,x.reps))):m==='c'?Math.max(...sets.map(x=>x.carga)):m==='t'?Math.max(...sets.map(x=>x.reps)):sets.reduce((t,x)=>t+x.reps,0);return{x:s.data,y}}).filter(Boolean);
    $('#evc').innerHTML=`<b>${esc(n)}</b>`+chart(pts,m==='t'||m==='tt'?'s':'kg')};
  $('#evx').onchange=()=>{opcoes();draw()};$('#evm').onchange=draw;opcoes();draw()}
function chart(p,un){if(!p.length)return'<p class="mut">Sem dados.</p>';
  const W=420,H=180,L=36,R=10,T=10,B=24,xs=p.map(q=>q.x),ys=p.map(q=>q.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=(un==='kg'||un==='s')?Math.floor(Math.min(...ys)*0.9):0,y1=Math.max(...ys)||1;
  const X=x=>L+(x1===x0?(W-L-R)/2:(x-x0)/(x1-x0)*(W-L-R)),Y=y=>T+(1-(y-y0)/((y1-y0)||1))*(H-T-B);
  return`<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="${L}" y1="${Y(y0)}" x2="${W-R}" y2="${Y(y0)}" stroke="#CCCCCC"/><text x="2" y="${Y(y1)+4}">${fmt(y1)}</text><text x="2" y="${Y(y0)+4}">${fmt(y0)}</text>
  <polyline fill="none" stroke="#E8A020" stroke-width="2.5" points="${p.map(q=>X(q.x)+','+Y(q.y)).join(' ')}"/>${p.map(q=>`<circle cx="${X(q.x)}" cy="${Y(q.y)}" r="4" fill="#E8A020"/>`).join('')}
  <text x="${L}" y="${H-6}">${dt(x0)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${dt(x1)}</text></svg><div class="mut">Último: ${fmt(ys[ys.length-1])} ${un}</div>`}

function parseBase(txt){
  const out={itens:[],rej:[]},t=txt.trim();if(!t)return out;
  if(/^[\[{]/.test(t)){let d;try{d=JSON.parse(t)}catch{out.rej.push('JSON inválido');return out}
    const L=Array.isArray(d)?d:(d.exercicios||d.exercises||[]);L.forEach(x=>{const n=String(x.nome||x.name||'').trim(),g=grupoOk(x.grupo||x.group||'');if(n&&g)out.itens.push({nome:n,grupo:g,tempo:x.tempo!==undefined?!!x.tempo:(x.medida?String(x.medida).toLowerCase().startsWith('temp'):undefined)});else out.rej.push(n||JSON.stringify(x))});return out}

  t.split(/\r?\n/).forEach(l0=>{let l=l0.replace(/^\s*(?:[-•*·]|\d+[.)])\s*/,'').replace(/^#+\s*/,'').trim();if(!l)return;
    const h=grupoOk(l.replace(/[:*#]+/g,'').trim());if(h&&!/[;|\t]/.test(l)&&l.length<=24){cur=h;return}
    const ex=/[;|\t]/.test(l),p=l.split(ex?/\s*[;|\t]\s*/:/\s+[-–—]\s+/).map(x=>x.trim()).filter(Boolean),g=p.length>1?grupoOk(p[p.length-1]):'';
    if(ex&&!g)out.rej.push(l0.trim());                                  // grupo escrito mas inválido: não adivinha
    else if(g)out.itens.push({nome:p.slice(0,-1).join(' - '),grupo:g});
    else if(cur)out.itens.push({nome:l,grupo:cur});else out.rej.push(l0.trim())});
  return out}
